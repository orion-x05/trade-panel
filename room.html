<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>小蓝鲸的房间</title>
<style>
:root{--bg1:#1b2740;--bg2:#0c1120}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 25%,var(--bg1),var(--bg2) 70%);
color:#e8eef8;font-family:-apple-system,"PingFang SC",sans-serif;min-height:100vh;display:flex;
flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none}
h1{font-size:17px;font-weight:600;margin:14px 0 2px;letter-spacing:.5px}
.sub{font-size:12px;color:#8296b4;margin:0 0 8px}
.stage{width:min(96vw,760px);position:relative}
svg{width:100%;height:auto;display:block;touch-action:none}
.card{position:absolute;left:0;top:0;background:rgba(16,22,36,.86);border:1px solid rgba(120,160,220,.25);
border-radius:14px;padding:10px 14px;font-size:12px;color:#9fb2cf;backdrop-filter:blur(6px)}
.card b{color:#dfe9f8;font-size:13px;font-weight:600}
.pill{display:inline-block;background:#2f6b4f;color:#bfe8cf;border-radius:999px;padding:1px 8px;margin-left:6px;font-size:11px}
.tip{font-size:11px;color:#5f7291;margin:6px 0 18px}
</style></head><body>
<h1>🐳 小蓝鲸的房间</h1>
<p class="sub">十二乘十格 · 家具可以拖</p>
<div class="stage">
<svg id="svg" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="floorG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3448"/><stop offset="1" stop-color="#1e2536"/></linearGradient>
<linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3a52"/><stop offset="1" stop-color="#232c40"/></linearGradient>
<linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#28324a"/><stop offset="1" stop-color="#1d2536"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="world"></g>
</svg>
<div class="card"><b>小蓝鲸</b><span class="pill">闲逛</span><br>逐条笔记：3 篇 · 窗外的雨刚停</div>
</div>
<p class="tip">拖动家具试试 · 位置会记住</p>
<script>
const C=Math.cos(Math.PI/6), S=Math.sin(Math.PI/6), U=30, OX=450, OY=120;
const GX=12, GZ=10;
const P=(x,y,z)=>[OX+(x-z)*C*U, OY+(x+z)*S*U - y*U];
const poly=(pts,f,extra="")=>`<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="${f}" ${extra}/>`;

let items=[
 {id:"bed",  x:0.6,z:0.6,w:3,  d:5.5,h:1.4,top:"#5c6f92",l:"#46577a",r:"#3a4a68",kind:"bed"},
 {id:"desk", x:7.6,z:0.6,w:4,  d:2,  h:2.6,top:"#8a6b4a",l:"#70563b",r:"#5e4832",kind:"desk"},
 {id:"shelf",x:10.0,z:0.6,w:1.6,d:1.4,h:5.4,top:"#7a5c40",l:"#644a33",r:"#543e2b",kind:"shelf"},
 {id:"sofa", x:4.3,z:6.6,w:3.2,d:1.8,h:1.8,top:"#4a5a7c",l:"#3a4866",r:"#2f3b55",kind:"sofa"},
 {id:"pot",  x:9.6,z:7.6,w:1.2,d:1.2,h:1.6,top:"#3f6b4f",l:"#335940",r:"#2a4a35",kind:"pot"},
 {id:"table",x:5.4,z:3.4,w:1.6,d:1.6,h:1.0,top:"#6b5a7c",l:"#564a64",r:"#463c52",kind:"table"},
];

function draw(){
  const g=document.getElementById("world"); let out="";
  // 地板
  out+=poly([P(0,0,0),P(GX,0,0),P(GX,0,GZ),P(0,0,GZ)],"url(#floorG)");
  for(let i=1;i<GX;i++) out+=`<line x1="${P(i,0,0)[0]}" y1="${P(i,0,0)[1]}" x2="${P(i,0,GZ)[0]}" y2="${P(i,0,GZ)[1]}" stroke="#334055" stroke-width="1"/>`;
  for(let j=1;j<GZ;j++) out+=`<line x1="${P(0,0,j)[0]}" y1="${P(0,0,j)[1]}" x2="${P(GX,0,j)[0]}" y2="${P(GX,0,j)[1]}" stroke="#334055" stroke-width="1"/>`;
  // 墙
  out+=poly([P(0,0,0),P(GX,0,0),P(GX,7,0),P(0,7,0)],"url(#wallL)");
  out+=poly([P(0,0,0),P(0,0,GZ),P(0,7,GZ),P(0,7,0)],"url(#wallR)");
  // 窗
  out+=poly([P(6.4,3,0.05),P(9.4,3,0.05),P(9.4,5.6,0.05),P(6.4,5.6,0.05)],"#101a2c","stroke='#4a6386' stroke-width='3'");
  out+=`<circle cx="${P(8.6,5.1,0.06)[0]}" cy="${P(8.6,5.1,0.06)[1]}" r="6" fill="#f5edc0"/>`;

  // 按深度排序
  items.slice().sort((a,b)=>(a.x+a.z)-(b.x+b.z)).forEach(it=>{
    const {x,z,w,d,h,top,l,r}=it;
    out+=`<g class="item" data-id="${it.id}">`;
    out+=poly([P(x,h,z),P(x+w,h,z),P(x+w,h,z+d),P(x,h,z+d)],top);
    out+=poly([P(x,0,z+d),P(x+w,0,z+d),P(x+w,h,z+d),P(x,h,z+d)],l);
    out+=poly([P(x+w,0,z),P(x+w,0,z+d),P(x+w,h,z+d),P(x+w,h,z)],r);
    if(it.kind==="bed"){
      out+=poly([P(x+0.2,h+0.05,z+0.6),P(x+w-0.2,h+0.05,z+0.6),P(x+w-0.2,h+0.05,z+d-0.3),P(x+0.2,h+0.05,z+d-0.3)],"#7d93b8");
      out+=poly([P(x+0.3,h+0.1,z+0.7),P(x+w-0.3,h+0.1,z+0.7),P(x+w-0.3,h+0.1,z+1.8),P(x+0.3,h+0.1,z+1.8)],"#cfd9ea");
    }
    if(it.kind==="desk"){
      out+=`<rect x="${P(x+1.4,h+0.9,z+0.9)[0]}" y="${P(x+1.4,h+0.9,z+0.9)[1]}" width="34" height="22" fill="#16202f" stroke="#4a6386"/>`;
    }
    if(it.kind==="shelf"){
      for(let k=0;k<3;k++){
        const yy=it.h*(0.25+k*0.25);
        out+=poly([P(x+0.1,yy,z+0.1),P(x+w-0.1,yy,z+0.1),P(x+w-0.1,yy+0.1,z+0.1),P(x+0.1,yy+0.1,z+0.1)],"#c9d6ea");
      }
    }
    if(it.kind==="pot"){
      for(const [dx,dy] of [[0,0.9],[0.5,0.6],[-0.4,0.7]]){
        out+=`<circle cx="${P(x+0.6+dx,h+dy,z+0.6)[0]}" cy="${P(x+0.6+dx,h+dy,z+0.6)[1]}" r="9" fill="#4f8a63"/>`;
      }
    }
    out+=`</g>`;
  });

  // 小人
  const [cx,cy]=P(6,0,5);
  out+=`<ellipse cx="${cx}" cy="${cy+4}" rx="26" ry="10" fill="#000" opacity=".35"/>`;
  out+=`<g class="me">`;
  out+=`<path d="M${cx} ${cy-96} q10 18 34 24 q-18 4 -26 -6 q-4 14 -8 18 z" fill="#3f6fa8"/>`; // 尾巴
  out+=`<path d="M${cx-16} ${cy-96} L${cx+16} ${cy-96} L${cx+22} ${cy} L${cx-22} ${cy} Z" fill="#e6eefc"/>`; // 裙
  out+=`<circle cx="${cx}" cy="${cy-112}" r="22" fill="#f6dfd0"/>`; // 脸
  out+=`<path d="M${cx-24} ${cy-112} a24 24 0 0 1 48 0 q-10 -14 -24 -14 q-14 0 -24 14 z" fill="#5f8fc8"/>`; // 刘海
  out+=`<path d="M${cx-24} ${cy-116} q-6 26 -2 40 q10 -6 8 -34 z" fill="#4d79b4"/>`;
  out+=`<path d="M${cx+24} ${cy-116} q6 26 2 40 q-10 -6 -8 -34 z" fill="#4d79b4"/>`;
  out+=`<rect x="${cx-20}" y="${cy-136}" width="40" height="5" rx="2.5" fill="#fbfdff"/>`; // 发带
  out+=`<circle cx="${cx-8}" cy="${cy-108}" r="2.6" fill="#2c3a52"/><circle cx="${cx+8}" cy="${cy-108}" r="2.6" fill="#2c3a52"/>`;
  out+=`</g>`;
  g.innerHTML=out;
}

// 拖动
let drag=null;
const svg=document.getElementById("svg");
function toGrid(px,py,base){
  const dx=px-base.sx, dy=py-base.sy;
  const a=dx/(C*U), b=dy/(S*U);
  const x=base.x+(a+b)/2, z=base.z+(b-a)/2;
  return [Math.round(x*2)/2, Math.round(z*2)/2];
}
function pt(e){const r=svg.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return [ (t.clientX-r.left)/r.width*900, (t.clientY-r.top)/r.height*640 ];}

svg.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".item"); if(!g)return;
  const id=g.dataset.id; const it=items.find(i=>i.id===id);
  const [px,py]=pt(e);
  drag={it, sx:px, sy:py, x:it.x, z:it.z}; e.preventDefault();
});
window.addEventListener("pointermove",e=>{
  if(!drag)return; const [px,py]=pt(e);
  const [nx,nz]=toGrid(px,py,{sx:drag.sx,sy:drag.sy,x:drag.x,z:drag.z});
  drag.it.x=Math.max(0,Math.min(GX-drag.it.w,nx));
  drag.it.z=Math.max(0,Math.min(GZ-drag.it.d,nz));
  draw();
});
window.addEventListener("pointerup",()=>{ if(drag){ save(); drag=null; } });

function save(){ try{ localStorage.setItem("room_v1", JSON.stringify(items.map(i=>({id:i.id,x:i.x,z:i.z})))); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem("room_v1")||"null");
  if(s) s.forEach(o=>{ const it=items.find(i=>i.id===o.id); if(it){it.x=o.x; it.z=o.z;} }); }catch(e){} }
load(); draw();
</script></body></html>
