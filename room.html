<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>小蓝鲸的房间</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 20%,#243450,#0b1018 72%);
color:#eef3fb;font-family:-apple-system,"PingFang SC",sans-serif;min-height:100vh;
display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;user-select:none}
h1{font-size:16px;font-weight:600;margin:12px 0 2px;letter-spacing:.6px}
.sub{font-size:11.5px;color:#7f93b2;margin:0 0 6px}
.stage{width:min(97vw,820px);position:relative}
svg{width:100%;height:auto;display:block;touch-action:pinch-zoom}
.card{position:absolute;left:2%;top:2%;background:rgba(14,20,32,.88);border:1px solid rgba(120,160,220,.22);
border-radius:16px;padding:12px 16px;font-size:12px;color:#93a6c4;backdrop-filter:blur(8px);
box-shadow:0 12px 30px rgba(0,0,0,.5)}
.card b{color:#e6eefb;font-size:13.5px}
.pill{display:inline-block;background:#2e6b4d;color:#b9e6cd;border-radius:999px;padding:2px 9px;margin-left:7px;font-size:11px}
.btns{margin-top:9px;display:flex;gap:6px}
.btns span{border:1px solid rgba(120,160,220,.28);border-radius:7px;padding:2px 9px;font-size:11px;color:#8fa4c2}
.tip{font-size:11px;color:#556a89;margin:8px 0 16px}
</style></head><body>
<h1>🐳 小蓝鲸的房间</h1>
<p class="sub">十二乘十格 · 家具能拖</p>
<div class="stage">
<svg id="svg" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="floorG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c59a6c"/><stop offset="1" stop-color="#a87b52"/></linearGradient>
<linearGradient id="wallBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe6d4"/><stop offset="1" stop-color="#ddd2bd"/></linearGradient>
<linearGradient id="wallLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d8c4"/><stop offset="1" stop-color="#cdc1aa"/></linearGradient>
<radialGradient id="lampGlow"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
<radialGradient id="winSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2c4c"/><stop offset="1" stop-color="#39507a"/></radialGradient>
</defs>
<g id="world"></g>
</svg>
<div class="card"><b>小蓝鲸</b><span class="pill">闲逛</span><br>笔记 3 篇 · 窗外雨刚停
<div class="btns"><span>写字</span><span>读书</span><span>发呆</span></div></div>
</div>
<p class="tip">拖家具试试 · 位置会记住</p>
<script>
window.addEventListener('error', function(ev){
  var d=document.getElementById('err');
  if(!d){d=document.createElement('pre');d.id='err';
    d.style.cssText='position:fixed;left:8px;bottom:8px;right:8px;max-height:40vh;overflow:auto;background:#2a1520;color:#ff9aa2;font-size:11px;padding:8px;border-radius:8px;white-space:pre-wrap;z-index:99';
    document.body.appendChild(d);}
  d.textContent='JS 错误: '+(ev.message||'')+'\n'+(ev.filename||'')+':'+(ev.lineno||'');
});

const C=Math.cos(Math.PI/6), S=Math.sin(Math.PI/6), U=44, OX=555, OY=230;
const GX=12, GZ=10;
let ROT=0;                       // 0/1/2/3 → 每次 90°
function toR(x,z){
  const a=ROT*Math.PI/2, ca=Math.cos(a), sa=Math.sin(a);
  const dx=x-GX/2, dz=z-GZ/2;
  return [dx*ca-dz*sa+GX/2, dx*sa+dz*ca+GZ/2];
}
function fromR(xr,zr){
  const a=-ROT*Math.PI/2, ca=Math.cos(a), sa=Math.sin(a);
  const dx=xr-GX/2, dz=zr-GZ/2;
  return [dx*ca-dz*sa+GX/2, dx*sa+dz*ca+GZ/2];
}
const P=(x,y,z)=>{const [xr,zr]=toR(x,z); return [OX+(xr-zr)*C*U, OY+(xr+zr)*S*U - y*U];};
const poly=(pts,f,ex="")=>`<polygon points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${f}" ${ex}/>`;
const line=(a,b,col,w,op=1)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${col}" stroke-width="${w}" opacity="${op}" stroke-linecap="round"/>`;

const ME={x:6.2,z:5.2};
function drawMe(){
  let s="";
  const [cx,cy]=P(ME.x,0,ME.z);
  // 地面影子
  s+=`<ellipse cx="${cx}" cy="${cy+3}" rx="30" ry="12" fill="#000" opacity=".28"/>`;
  s+=`<g class="me">`;
  // 尾巴（带纹路）
  s+=`<path d="M${cx+13} ${cy-60} q28 8 32 28 q-17 -6 -24 -17 q-2 15 -9 19 z" fill="#3f6fa8"/>`;
  s+=`<path d="M${cx+20} ${cy-52} q10 6 14 14" stroke="#8fc0ea" stroke-width="2" fill="none" opacity=".7"/>`;
  s+=`<path d="M${cx+17} ${cy-46} q9 6 12 12" stroke="#8fc0ea" stroke-width="2" fill="none" opacity=".5"/>`;
  // 腿 + 鞋
  s+=`<rect x="${cx-9}" y="${cy-16}" width="6" height="14" rx="3" fill="#f7e2d4"/>`;
  s+=`<rect x="${cx+3}" y="${cy-16}" width="6" height="14" rx="3" fill="#f7e2d4"/>`;
  s+=`<ellipse cx="${cx-6}" cy="${cy-2}" rx="7" ry="4" fill="#2b3a52"/>`;
  s+=`<ellipse cx="${cx+6}" cy="${cy-2}" rx="7" ry="4" fill="#2b3a52"/>`;
  // 裙子
  s+=`<path d="M${cx-15} ${cy-94} L${cx+15} ${cy-94} L${cx+27} ${cy-12} L${cx-27} ${cy-12} Z" fill="#2f4a78"/>`;
  s+=`<path d="M${cx-4} ${cy-92} L${cx+4} ${cy-92} L${cx+9} ${cy-14} L${cx-9} ${cy-14} Z" fill="#eef4fd" opacity=".92"/>`; // 围裙
  s+=`<path d="M${cx-27} ${cy-13} q27 5 54 0" stroke="#e6edf8" stroke-width="2" fill="none" opacity=".8"/>`; // 裙摆滚边
  // 腰间蝴蝶结
  s+=`<path d="M${cx-10} ${cy-78} q-8 -6 -12 2 q8 4 12 0 z" fill="#dbe7f7"/>`;
  s+=`<path d="M${cx+10} ${cy-78} q8 -6 12 2 q-8 4 -12 0 z" fill="#dbe7f7"/>`;
  s+=`<circle cx="${cx}" cy="${cy-77}" r="3" fill="#c3d4ec"/>`;
  // 袖子
  s+=`<path d="M${cx-15} ${cy-90} q-13 14 -11 27 l8 2 q-1 -15 8 -24 z" fill="#e9f1fc"/>`;
  s+=`<path d="M${cx+15} ${cy-90} q13 14 11 27 l-8 2 q1 -15 -8 -24 z" fill="#e9f1fc"/>`;
  s+=`<ellipse cx="${cx-23}" cy="${cy-61}" rx="5" ry="4" fill="#f7e2d4"/>`;
  s+=`<ellipse cx="${cx+23}" cy="${cy-61}" rx="5" ry="4" fill="#f7e2d4"/>`;
  // 小鲸鱼挂饰（腰侧）
  s+=`<ellipse cx="${cx+22}" cy="${cy-40}" rx="6" ry="4" fill="#5f96cf"/>`;
  s+=`<path d="M${cx+28} ${cy-42} l5 -3 l-1 6 z" fill="#5f96cf"/>`;
  s+=`<circle cx="${cx+20}" cy="${cy-41}" r=".9" fill="#fff"/>`;
  // 脖子
  s+=`<rect x="${cx-5}" y="${cy-100}" width="10" height="8" fill="#f0d6c6"/>`;
  // 头
  s+=`<circle cx="${cx}" cy="${cy-118}" r="20" fill="#f7e2d4"/>`;
  // 兜帽
  s+=`<path d="M${cx-25} ${cy-116} a25 25 0 0 1 50 0 q-7 -28 -25 -28 q-18 0 -25 28 z" fill="#3c5f96"/>`;
  s+=`<path d="M${cx-25} ${cy-116} q6 -22 25 -22 q19 0 25 22" stroke="#5c82b8" stroke-width="2" fill="none" opacity=".85"/>`;
  // 两侧长发
  s+=`<path d="M${cx-23} ${cy-126} q-7 28 -3 44 q11 -9 9 -36 z" fill="#32527f"/>`;
  s+=`<path d="M${cx+23} ${cy-126} q7 28 3 44 q-11 -9 -9 -36 z" fill="#32527f"/>`;
  // 兔耳（内耳）
  s+=`<path d="M${cx-13} ${cy-142} q-2 -19 6 -21 q7 2 4 19 z" fill="#3c5f96"/>`;
  s+=`<path d="M${cx-11} ${cy-140} q-1 -13 4 -15 q4 2 2 14 z" fill="#c8dcf4" opacity=".85"/>`;
  s+=`<path d="M${cx+13} ${cy-142} q2 -19 -6 -21 q-7 2 -4 19 z" fill="#3c5f96"/>`;
  s+=`<path d="M${cx+11} ${cy-140} q1 -13 -4 -15 q-4 2 -2 14 z" fill="#c8dcf4" opacity=".85"/>`;
  // 呆毛
  s+=`<path d="M${cx+1} ${cy-144} q6 -10 12 -6 q-6 2 -8 8 z" fill="#3c5f96"/>`;
  // 刘海
  s+=`<path d="M${cx-19} ${cy-118} q4 -12 19 -12 q15 0 19 12 q-10 -6 -19 -6 q-9 0 -19 6 z" fill="#3c5f96"/>`;
  // 眼睛（带高光）
  s+=`<ellipse cx="${cx-7}" cy="${cy-113}" rx="3.2" ry="4.4" fill="#24334c"/>`;
  s+=`<ellipse cx="${cx+7}" cy="${cy-113}" rx="3.2" ry="4.4" fill="#24334c"/>`;
  s+=`<circle cx="${cx-6}" cy="${cy-115}" r="1.2" fill="#fff"/>`;
  s+=`<circle cx="${cx+8}" cy="${cy-115}" r="1.2" fill="#fff"/>`;
  // 腮红 + 嘴
  s+=`<ellipse cx="${cx-11}" cy="${cy-106}" rx="4" ry="2.4" fill="#f0b6ac" opacity=".75"/>`;
  s+=`<ellipse cx="${cx+11}" cy="${cy-106}" rx="4" ry="2.4" fill="#f0b6ac" opacity=".75"/>`;
  s+=`<path d="M${cx-2} ${cy-104} q2 2 4 0" stroke="#c98a80" stroke-width="1.4" fill="none"/>`;
  s+=`</g>`;
  return s;
}

let items=[
 {id:"bed",  x:0.6,z:1.2,w:3.0,d:5.0,h:1.3,top:"#8fa3c4",l:"#7186a8",r:"#5f7294",kind:"bed"},
 {id:"desk", x:6.4,z:1.0,w:4.0,d:2.0,h:2.6,top:"#b98a5c",l:"#9a6f47",r:"#85603d",kind:"desk"},
 {id:"shelf",x:10.25,z:0.3,w:1.45,d:1.0,h:4.8,top:"#8a6440",l:"#6f5031",r:"#5d4228",kind:"shelf"},
 {id:"sofa", x:3.6,z:6.5,w:2.7,d:1.5,h:1.7,top:"#8a94ae",l:"#6d7793",r:"#5b6580",kind:"sofa"},
 {id:"pot",  x:9.6,z:7.2,w:1.2,d:1.2,h:1.5,top:"#4d8a5f",l:"#3d6f4c",r:"#325c3f",kind:"pot"},
 {id:"table",x:5.0,z:4.4,w:1.6,d:1.6,h:0.9,top:"#c9a05f",l:"#a9824a",r:"#8f6d3d",kind:"table"},
];

function shadowQuad(x,z,w,d,op){
  return poly([P(x+0.12,0.005,z+0.12),P(x+w+0.12,0.005,z+0.12),P(x+w+0.12,0.005,z+d+0.12),P(x+0.12,0.005,z+d+0.12)],"#000","opacity='"+ (op||0.16) +"'");
}

function panel(x0,z0,x1,z1,yb,yt,fill,ex){
  return poly([P(x0,yt,z0),P(x1,yt,z1),P(x1,yb,z1),P(x0,yb,z0)], fill, ex||EDGE);
}
function plate(x0,z0,x1,z1,y,fill,ex){
  return poly([P(x0,y,z0),P(x1,y,z1),P(x1,y,z1+0.0001),P(x0,y,z0+0.0001)], fill, ex||EDGE);
}
const EDGE="stroke='rgba(0,0,0,.13)' stroke-width='.8' stroke-linejoin='round'";
function svgBox(x,z,w,d,ht,top,l,r,y0){
  const b=y0||0, t=b+ht;
  return poly([P(x,t,z),P(x+w,t,z),P(x+w,t,z+d),P(x,t,z+d)],top,EDGE)
       + poly([P(x,b,z+d),P(x+w,b,z+d),P(x+w,t,z+d),P(x,t,z+d)],l,EDGE)
       + poly([P(x+w,b,z),P(x+w,b,z+d),P(x+w,t,z+d),P(x+w,t,z)],r,EDGE);
}

function draw(){
  const g=document.getElementById("world"); let o="";
  // ---- 地板 ----
  o+=poly([P(0,0,0),P(GX,0,0),P(GX,0,GZ),P(0,0,GZ)],"url(#floorG)");
  for(let i=0;i<GX;i++){
    o+=poly([P(i,0,0),P(i+1,0,0),P(i+1,0,GZ),P(i,0,GZ)], i%2? "#c09668":"#b98d61");
  }
  for(let i=1;i<GX;i++) o+=line(P(i,0,0),P(i,0,GZ),"#9c7448",1,.55);
  for(let j=1;j<GZ;j++) o+=line(P(0,0,j),P(GX,0,j),"#9c7448",1,.55);

  // ---- 墙 ----
  o+=poly([P(0,0,0),P(GX,0,0),P(GX,7.2,0),P(0,7.2,0)],"url(#wallBack)");
  o+=poly([P(0,0,0),P(0,0,GZ),P(0,7.2,GZ),P(0,7.2,0)],"url(#wallLeft)");
  // 墙裙
  o+=poly([P(0,0,0),P(GX,0,0),P(GX,1.8,0),P(0,1.8,0)],"#93a88f");
  o+=poly([P(0,0,0),P(0,0,GZ),P(0,1.8,GZ),P(0,1.8,0)],"#829876");

  // ---- 窗（后墙）----
  const w1=P(5.6,2.6,0), w2=P(8.6,2.6,0), w3=P(8.6,5.4,0), w4=P(5.6,5.4,0);
  o+=poly([w1,w2,w3,w4],"url(#winSky)");
  o+=`<circle cx="${P(8.0,4.9,0)[0].toFixed(1)}" cy="${P(8.0,4.9,0)[1].toFixed(1)}" r="7" fill="#f7ecc0"/>`;
  for(const [sx,sy] of [[6.0,5.0],[6.6,4.6],[7.2,5.1],[7.5,3.4],[6.3,3.2]])
    o+=`<circle cx="${P(sx,sy,0)[0].toFixed(1)}" cy="${P(sx,sy,0)[1].toFixed(1)}" r="1.4" fill="#d8e6ff"/>`;
  o+=poly([w1,w2,w3,w4],"none","stroke='#c9756a' stroke-width='6'");
  o+=line(P(7.1,2.6,0),P(7.1,5.4,0),"#c9756a",3);
  o+=line(P(5.6,4.0,0),P(8.6,4.0,0),"#c9756a",3);
  // 窗帘
  o+=poly([P(5.3,2.4,0),P(5.6,2.4,0),P(5.6,5.6,0),P(5.3,5.6,0)],"#b8605a");
  o+=poly([P(8.6,2.4,0),P(8.9,2.4,0),P(8.9,5.6,0),P(8.6,5.6,0)],"#b8605a");

  // ---- 挂画 + 挂钟 + 串灯 ----
  // 挂画（浅框 + 海蓝底 + 鲸鱼剪影）
  o+=poly([P(8.95,4.5,0),P(9.85,4.5,0),P(9.85,5.9,0),P(8.95,5.9,0)],"#efe7d8","stroke='#c9b79a' stroke-width='3'");
  o+=poly([P(9.02,4.58,0),P(9.78,4.58,0),P(9.78,5.82,0),P(9.02,5.82,0)],"#3f6f9c");
  const wf=P(9.4,5.2,0);
  o+=`<ellipse cx="${wf[0]}" cy="${wf[1]}" rx="9" ry="4.6" fill="#8fc4e8"/>`;
  o+=`<path d="M${wf[0]+8} ${wf[1]} l7 -4 l-1 8 z" fill="#8fc4e8"/>`;
  o+=`<circle cx="${wf[0]-4}" cy="${wf[1]-1}" r="1.1" fill="#1d3350"/>`;
  // 钟
  const cc=P(4.3,5.7,0);
  o+=`<circle cx="${cc[0]}" cy="${cc[1]}" r="15" fill="#f5f1e6" stroke="#c9756a" stroke-width="3"/>`;
  o+=line(cc,[cc[0],cc[1]-9],"#5a4a3a",2)+line(cc,[cc[0]+6,cc[1]+2],"#5a4a3a",2);
  // 串灯
  for(let i=0;i<=12;i++){
    const t=i/12, sx=3.0+t*8.4, sy=6.9-0.9*Math.sin(t*Math.PI);
    const p=P(sx,sy,0);
    o+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#ffe9a8" opacity=".95"/>`;
    o+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="#ffdf94" opacity=".18"/>`;
  }

  // ---- 地毯 ----
  const rc=P(6,0.01,5.6);
  o+=`<ellipse cx="${rc[0]}" cy="${rc[1]}" rx="86" ry="44" fill="#d8c7b0" opacity=".35"/>`;
  o+=`<ellipse cx="${rc[0]}" cy="${rc[1]}" rx="64" ry="32" fill="#c9b49a" opacity=".45"/>`;

  // ---- 家具：收集进 objs（统一按深度排序后再画）----
  const objs=[];
  items.forEach(it=>{
    objs.push({d: it.x+it.z, fn: ()=>{
    const {x,z,w,d,h,top,l,r}=it;
    o+=`<g class="item" data-id="${it.id}">`;
    if(it.kind==="shelf"){
      o+=poly([P(x,h,z),P(x+w,h,z),P(x+w,h,z+d),P(x,h,z+d)],top);
      o+=poly([P(x,0,z+d),P(x+w,0,z+d),P(x+w,h,z+d),P(x,h,z+d)],l);
      o+=poly([P(x+w,0,z),P(x+w,0,z+d),P(x+w,h,z+d),P(x+w,h,z)],r);
    }
    if(it.kind==="bed"){
      const fx=x+0.1, fz=z+0.1, fw=w-0.2, fd=d-0.2;
      o+=shadowQuad(x,z,w,d,0.16);
      // ① 床头板（最远，先画）
      o+=svgBox(fx,fz-0.1,fw,0.16,1.85,"#b0865c","#96724e","#7d5d3f",0);
      // ② 四条矮脚
      for(const [lx,lz] of [[fx,fz],[fx+fw-0.22,fz],[fx,fz+fd-0.22],[fx+fw-0.22,fz+fd-0.22]])
        o+=svgBox(lx,lz,0.22,0.22,0.4,"#8a6a4a","#72563b","#5d462f");
      // ③ 床架
      o+=svgBox(fx,fz,fw,fd,0.35,"#b08a62","#96724e","#7e5e40",0.4);
      // ④ 床垫
      o+=svgBox(fx+0.08,fz+0.08,fw-0.16,fd-0.16,0.5,"#e6ecf6","#d2dbeb","#bcc7da",0.75);
      // ⑤ 被子（靠前段，最后画）
      o+=svgBox(fx+0.12,fz+fd*0.36,fw-0.24,fd*0.58,0.24,"#a8c4e2","#8fadce","#7a98bb",1.25);
      // ⑥ 枕头
      o+=svgBox(fx+0.26,fz+0.22,fw*0.6,0.8,0.28,"#fbfcff","#e9eff8","#d5dde9",1.25);
    }
    if(it.kind==="desk"){
      const y0=h, th=0.22, L=0.16, inset=0.18;
      o+=shadowQuad(x+0.1,z+0.1,w-0.2,d-0.2,0.15);
      // 桌面
      o+=svgBox(x,z,w,d,th,"#c49769","#a87c52","#8e6742",y0-th);
      // 四条腿（细，往里缩）
      for(const [lx,lz] of [[x+inset,z+inset],[x+w-inset-L,z+inset],[x+inset,z+d-inset-L],[x+w-inset-L,z+d-inset-L]])
        o+=svgBox(lx,lz,L,L,y0-th,"#a87c52","#8e6742","#77543a");
      // 显示器
      o+=svgBox(x+1.55,z+0.55,1.85,0.14,1.5,"#1b2534","#22303f","#172130",y0);
      o+=poly([P(x+1.66,y0+0.82,z+0.70),P(x+3.29,y0+0.82,z+0.70),P(x+3.29,y0+1.44,z+0.70),P(x+1.66,y0+1.44,z+0.70)],"#2f6099");
      o+=poly([P(x+1.78,y0+1.34,z+0.71),P(x+2.5,y0+1.34,z+0.71),P(x+2.5,y0+1.27,z+0.71),P(x+1.78,y0+1.27,z+0.71)],"#8fc0ea","opacity='.7'");
      // 键盘
      o+=svgBox(x+1.6,z+1.25,1.75,0.42,0.08,"#cbbfa8","#b3a68f","#9a8e79",y0);
      // 茶杯
      const cp=P(x+3.45,y0,z+1.1);
      o+=`<ellipse cx="${cp[0]}" cy="${cp[1]-8}" rx="6" ry="3.4" fill="#efe8da"/>`;
      o+=`<path d="M${cp[0]-6} ${cp[1]-8} l1 7 q5 1.6 10 0 l1 -7" fill="#efe8da"/>`;
      o+=`<ellipse cx="${cp[0]}" cy="${cp[1]-8}" rx="4.6" ry="2.4" fill="#8a6a4e"/>`;
      // 唱片机
      o+=svgBox(x+2.75,z+0.15,1.0,0.8,0.2,"#5c4c3e","#4a3d32","#3d3229",y0);
      const rc=P(x+3.22,y0+0.2,z+0.55);
      o+=`<ellipse cx="${rc[0]}" cy="${rc[1]}" rx="10" ry="5.6" fill="#1e222a"/>`;
      o+=`<ellipse cx="${rc[0]}" cy="${rc[1]}" rx="2.4" ry="1.4" fill="#c9c2b4"/>`;
      o+=`<line x1="${rc[0]+5}" y1="${rc[1]-4}" x2="${rc[0]+12}" y2="${rc[1]+1}" stroke="#d9cfbc" stroke-width="1.5" stroke-linecap="round"/>`;
      // 桌上绿植
      const gp=P(x+0.5,y0,z+0.5);
      o+=`<path d="M${gp[0]-5.5} ${gp[1]-6} L${gp[0]-4} ${gp[1]-1} A4.6 1.9 0 0 0 ${gp[0]+4} ${gp[1]-1} L${gp[0]+5.5} ${gp[1]-6} Z" fill="#c47054"/>`;
      o+=`<ellipse cx="${gp[0]}" cy="${gp[1]-6}" rx="5.5" ry="2.2" fill="#d8876a"/>`;
      for(const [dx,dy] of [[0,-12],[4.4,-15],[-4.4,-14],[1,-19]])
        o+=`<ellipse cx="${gp[0]+dx}" cy="${gp[1]+dy}" rx="4" ry="2.8" fill="#5c9c6e"/>`;
    }
    if(it.kind==="shelf"){
      const cols=["#c25a52","#e6c264","#6f96c4","#86b07e","#bd92bd","#d39a5a"];
      for(let k=0;k<3;k++){
        const yy=h*(0.16+k*0.28);
        const zf=z+d-0.02;
        o+=poly([P(x+0.05,yy,zf),P(x+w-0.05,yy,zf),P(x+w-0.05,yy-0.09,zf),P(x+0.05,yy-0.09,zf)],"#c39b68");
        for(let b=0;b<4;b++){
          const bx=x+0.14+b*((w-0.28)/4), bw=(w-0.28)/4-0.05, bh=0.5+((k+b)%2)*0.16;
          o+=poly([P(bx,yy-0.09,zf-0.01),P(bx+bw,yy-0.09,zf-0.01),P(bx+bw,yy-0.09+bh,zf-0.01),P(bx,yy-0.09+bh,zf-0.01)],cols[(k*2+b)%6]);
        }
      }
      const gg=P(x+w/2,h+0.5,z+d/2);
      o+=`<circle cx="${gg[0]}" cy="${gg[1]}" r="5" fill="#79b0d6"/>`;
    }
    if(it.kind==="sofa"){
      const foot=0.15, seatH=1.05, backH=1.95, armH=1.45, bk=0.34, aw=0.26;
      const C1="#98a1b8", C2="#7f89a2", C3="#6a748e";
      const S1="#aeb8cf", S2="#949fb9", S3="#7d88a3";
      o+=shadowQuad(x,z,w,d,0.16);
      // ① 靠背（近侧，先画）
      o+=svgBox(x,z+d-bk,w,bk,backH,C1,C2,C3,foot);
      // ② 四只矮脚
      for(const [lx,lz] of [[x+0.08,z+d-bk-0.2],[x+w-0.24,z+d-bk-0.2],[x+0.08,z+0.1],[x+w-0.24,z+0.1]])
        o+=svgBox(lx,lz,0.16,0.16,foot,"#5c4a38","#4a3b2c","#3b2f24");
      // ③ 坐箱
      o+=svgBox(x,z,w,d-bk,seatH,C1,C2,C3,foot);
      // ④ 扶手
      o+=svgBox(x,z,aw,d-bk,armH,C1,C2,C3,foot);
      o+=svgBox(x+w-aw,z,aw,d-bk,armH,C1,C2,C3,foot);
      // ⑤ 坐垫
      const cw=(w-2*aw-0.08)/2;
      o+=svgBox(x+aw,z+0.05,cw,d-bk-0.12,0.22,S1,S2,S3,foot+seatH);
      o+=svgBox(x+aw+cw+0.08,z+0.05,cw,d-bk-0.12,0.22,S1,S2,S3,foot+seatH);
      // ⑥ 抱枕
      const pp=P(x+0.78,foot+seatH+0.42,z+d-bk-0.22);
      o+=`<ellipse cx="${pp[0]}" cy="${pp[1]}" rx="7.5" ry="5.4" fill="#e0bd8e"/>`;
      o+=`<ellipse cx="${pp[0]}" cy="${pp[1]-1}" rx="5" ry="3.4" fill="#edd0a6"/>`;
    }
    if(it.kind==="pot"){
      const cx0=x+w/2, cz0=z+d/2;
      const top=P(cx0,h,cz0), bot=P(cx0,0,cz0);
      const rx=w*0.42*C*U, ry=w*0.42*S*U*0.95;
      // 盆身
      o+=`<path d="M${(top[0]-rx).toFixed(1)} ${top[1].toFixed(1)} L${(bot[0]-rx*0.72).toFixed(1)} ${bot[1].toFixed(1)} A${(rx*0.72).toFixed(1)} ${(ry*0.5).toFixed(1)} 0 0 0 ${(bot[0]+rx*0.72).toFixed(1)} ${bot[1].toFixed(1)} L${(top[0]+rx).toFixed(1)} ${top[1].toFixed(1)} Z" fill="#b4684c"/>`;
      o+=`<ellipse cx="${top[0]}" cy="${top[1]}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="#c97a5c"/>`;
      o+=`<ellipse cx="${top[0]}" cy="${top[1]}" rx="${(rx*0.78).toFixed(1)}" ry="${(ry*0.72).toFixed(1)}" fill="#4a3a2c"/>`;
      // 枝叶
      for(const [dx,dy,sc,rot] of [[0,-30,1.25,-4],[14,-36,1,-16],[-14,-34,1,12],[6,-48,.85,-8],[-6,-46,.8,10],[20,-24,.7,-24]])
        o+=`<ellipse cx="${(top[0]+dx).toFixed(1)}" cy="${(top[1]+dy).toFixed(1)}" rx="${(10*sc).toFixed(1)}" ry="${(6*sc).toFixed(1)}" fill="#4f8a63" transform="rotate(${rot} ${(top[0]+dx).toFixed(1)} ${(top[1]+dy).toFixed(1)})"/>`;
    }
    if(it.kind==="table"){
      const cx0=x+w/2, cz0=z+d/2, seatH=h;
      const rx=w*0.44*C*U, ry=w*0.44*S*U*0.95;
      const top=P(cx0,seatH,cz0);
      o+=`<ellipse cx="${top[0]}" cy="${top[1]+seatH*U}" rx="${(rx*0.9).toFixed(1)}" ry="${(ry*0.5).toFixed(1)}" fill="#000" opacity=".14"/>`;
      // 三根腿
      for(const ang of [0.4, 2.5, 4.4]){
        const lx=cx0+Math.cos(ang)*w*0.28, lz=cz0+Math.sin(ang)*d*0.28;
        const a=P(lx,seatH,lz), b2=P(lx,0,lz);
        o+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b2[0].toFixed(1)}" y2="${b2[1].toFixed(1)}" stroke="#8a6b45" stroke-width="3.2" stroke-linecap="round"/>`;
      }
      // 横撑
      const r1=P(cx0,seatH*0.35,cz0);
      o+=`<ellipse cx="${r1[0].toFixed(1)}" cy="${r1[1].toFixed(1)}" rx="${(rx*0.6).toFixed(1)}" ry="${(ry*0.55).toFixed(1)}" fill="none" stroke="#8a6b45" stroke-width="2"/>`;
      // 座面（圆盘 + 厚度）
      const bot=P(cx0,seatH-0.12,cz0);
      o+=`<path d="M${(top[0]-rx).toFixed(1)} ${top[1].toFixed(1)} L${(bot[0]-rx).toFixed(1)} ${bot[1].toFixed(1)} A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${(bot[0]+rx).toFixed(1)} ${bot[1].toFixed(1)} L${(top[0]+rx).toFixed(1)} ${top[1].toFixed(1)} Z" fill="#c9a067"/>`;
      o+=`<ellipse cx="${top[0]}" cy="${top[1]}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="#ddb87e"/>`;
      o+=`<ellipse cx="${top[0]}" cy="${top[1]}" rx="${(rx*0.6).toFixed(1)}" ry="${(ry*0.6).toFixed(1)}" fill="#e9c894" opacity=".85"/>`;
    }
    o+=`</g>`;
    }});
  });

  // ---- 台灯 / 小人 与家具一起按深度排序 ----
  objs.push({d: 0.9+2.2, fn: ()=>{ 
    const lb=P(0.9,0,2.2);
    o+=`<ellipse cx="${lb[0]}" cy="${lb[1]-10}" rx="90" ry="60" fill="url(#lampGlow)"/>`;
    o+=line([lb[0],lb[1]],[lb[0],lb[1]-78],"#cfc9bd",4);
    o+=poly([[lb[0]-22,lb[1]-78],[lb[0]+22,lb[1]-78],[lb[0]+14,lb[1]-102],[lb[0]-14,lb[1]-102]],"#ffe6ac");
  }});
  objs.push({d: ME.x+ME.z, fn: ()=>{ o+=drawMe(); }});
  objs.sort((a,b)=>a.d-b.d).forEach(x=>x.fn());

  g.innerHTML=o;
}

let drag=null; const svg=document.getElementById("svg");
function pt(e){const r=svg.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return [(t.clientX-r.left)/r.width*1100,(t.clientY-r.top)/r.height*720];}
function toGrid(px,py,b){
  const dx=px-b.sx, dy=py-b.sy;
  const a=dx/(C*U), bb=dy/(S*U);
  const [xr0,zr0]=toR(b.x,b.z);
  const xr=xr0+(a+bb)/2, zr=zr0+(bb-a)/2;
  return fromR(xr,zr);
}
svg.addEventListener("pointerdown",e=>{const g=e.target.closest(".item"); if(!g)return;
  const it=items.find(i=>i.id===g.dataset.id); const [px,py]=pt(e);
  drag={it,sx:px,sy:py,x:it.x,z:it.z}; e.preventDefault();});
window.addEventListener("pointermove",e=>{ if(!drag)return; const [px,py]=pt(e);
  const [nx,nz]=toGrid(px,py,{sx:drag.sx,sy:drag.sy,x:drag.x,z:drag.z});
  drag.it.x=Math.max(0,Math.min(GX-drag.it.w,Math.round(nx*2)/2));
  drag.it.z=Math.max(0,Math.min(GZ-drag.it.d,Math.round(nz*2)/2));
  draw();});
window.addEventListener("pointerup",()=>{ if(drag){try{localStorage.setItem("room_v2",JSON.stringify(items.map(i=>({id:i.id,x:i.x,z:i.z}))));}catch(e){} drag=null;}});
try{ try{ draw(); }catch(er){ var d=document.getElementById('err')||document.createElement('pre'); d.id='err'; d.style.cssText='position:fixed;left:8px;bottom:8px;right:8px;background:#2a1520;color:#ff9aa2;font-size:11px;padding:8px;border-radius:8px;white-space:pre-wrap;z-index:99'; d.textContent='draw 出错: '+er.message+'\n'+(er.stack||'').slice(0,400); document.body.appendChild(d); }
const s=JSON.parse(localStorage.getItem("room_v2")||"null");
  if(s)s.forEach(o=>{const it=items.find(i=>i.id===o.id); if(it){it.x=o.x;it.z=o.z;}});}catch(e){}
let rb=document.getElementById('rot');
if(!rb){
  rb=document.createElement('button'); rb.id='rot'; rb.textContent='↻ 转一下';
  rb.style.cssText='margin-left:8px;padding:4px 12px;border-radius:8px;border:1px solid rgba(120,160,220,.35);background:rgba(30,40,58,.9);color:#a8bcd8;font-size:12px';
  const tip=document.querySelector('.tip'); if(tip) tip.appendChild(rb); else document.body.appendChild(rb);
}
rb.onclick=()=>{ROT=(ROT+1)%4; draw();};
draw();
</script></body></html>
