name: AI交易引擎定时任务

# 每天交易时间自动运行
on:
  schedule:
    # 北京时间 9:35, 10:00, 10:30, 11:00, 11:30, 13:30, 14:00, 14:30, 15:00
    - cron: '35 1 * * *'   # 9:35 北京时间
    - cron: '0 2 * * *'    # 10:00
    - cron: '30 2 * * *'   # 10:30
    - cron: '0 3 * * *'    # 11:00
    - cron: '30 3 * * *'   # 11:30
    - cron: '30 5 * * *'   # 13:30
    - cron: '0 6 * * *'    # 14:00
    - cron: '30 6 * * *'   # 14:30
    - cron: '0 7 * * *'    # 15:00
  workflow_dispatch:  # 允许手动触发

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行交易引擎
        run: python trade_engine.py

      - name: 用GitHub API更新data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用GitHub API上传data.json
          FILE_CONTENT=$(base64 -w 0 data.json)
          # 获取当前文件sha
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/orion-x05/trade-panel/contents/data.json?ref=main" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))")
          
          echo "当前文件sha: $SHA"
          
          # 上传
          curl -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/orion-x05/trade-panel/contents/data.json" \
            -d "{\"message\":\"auto: 交易引擎更新 $(date)\",\"content\":\"$FILE_CONTENT\",\"sha\":\"$SHA\",\"branch\":\"main\"}"
          
          echo "✅ data.json 已更新"
