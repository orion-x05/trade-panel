name: AI交易引擎定时任务

# 每天交易时间自动运行
on:
  schedule:
    # 北京时间 9:35, 10:00, 10:30, 11:00, 11:30, 13:30, 14:00, 14:30, 15:00, 15:05(收盘总结), 15:30(兜底)
    # 收盘总结窗口已放宽到 15:00-15:55，且有 data.json 跨运行去重标记，
    # 多个 cron 落在窗口内不会重复推送；15:30 兜底防 15:05 排队延迟错过
    - cron: '35 1 * * *'   # 9:35 北京时间
    - cron: '0 2 * * *'    # 10:00
    - cron: '30 2 * * *'   # 10:30
    - cron: '0 3 * * *'    # 11:00
    - cron: '30 3 * * *'   # 11:30
    - cron: '30 5 * * *'   # 13:30
    - cron: '0 6 * * *'    # 14:00
    - cron: '30 6 * * *'   # 14:30
    - cron: '0 7 * * *'    # 15:00
    - cron: '5 7 * * *'    # 15:05 收盘总结推送
    - cron: '30 7 * * *'   # 15:30 收盘总结兜底（窗口内已推过则自动跳过）
  workflow_dispatch:  # 允许手动触发
    inputs:
      force_summary:
        description: '强制发送每日收盘总结（忽略时间窗口，用于补发/验证）'
        type: boolean
        default: false

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      # 双保险：runner 默认 TZ=UTC，这里显式设为北京时间，
      # 配合 trade_engine.py 的 cn_now()（不依赖环境变量，恒定 UTC+8）
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行交易引擎
        env:
          # 在仓库 Settings → Secrets and variables → Actions 配置：
          #   WXPUSHER_APP_TOKEN (AT_xxx)、WXPUSHER_UID (UID_xxx)
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WXPUSHER_TOPIC_ID: ${{ secrets.WXPUSHER_TOPIC_ID }}
          WECHAT_PUSH_KEY: ${{ secrets.WECHAT_PUSH_KEY }}
          FORCE_SUMMARY: ${{ github.event.inputs.force_summary || '0' }}
        run: python trade_engine.py

      - name: 用GitHub API更新data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用GitHub API上传data.json
          FILE_CONTENT=$(base64 -w 0 data.json)
          # 获取当前文件sha
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/orion-x05/trade-panel/contents/data.json?ref=main" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))")
          
          echo "当前文件sha: $SHA"
          
          # 上传
          curl -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/orion-x05/trade-panel/contents/data.json" \
            -d "{\"message\":\"auto: 交易引擎更新 $(date)\",\"content\":\"$FILE_CONTENT\",\"sha\":\"$SHA\",\"branch\":\"main\"}"
          
          echo "✅ data.json 已更新"
