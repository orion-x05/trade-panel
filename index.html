<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="color-scheme" content="dark">
<title>Orion-X</title>
<style>
:root{
  --bg:#08080a; --card:#131316; --card2:#191a1e; --line:rgba(255,255,255,.07);
  --txt:#f2f2f4; --dim:#9a9aa2; --faint:#6a6a72;
  --warm-a:#ffd3a3; --warm-b:#ff8f6b;
  --up:#f2555a; --down:#3ecf8e; --warn:#e8b339;
  --r:22px; --r-sm:14px; --pill:999px;
  --gap:16px; --pad:22px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --out:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{color-scheme:dark}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Segoe UI Variable","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;line-height:1.45;
  min-height:100%;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:59;
  background:radial-gradient(120% 80% at 50% 0%,transparent 55%,rgba(0,0,0,.5) 100%);
}

.wrap{max-width:1280px;margin:0 auto;padding:20px 22px 40px;position:relative;z-index:1}

/* ================= 顶栏 ================= */
.nav{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  margin-bottom:20px;position:sticky;top:0;z-index:55;
  padding:10px 0;background:rgba(8,8,10,.82);
  backdrop-filter:blur(14px) saturate(150%);
}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--warm-a),var(--warm-b));color:#1a0f08;font-weight:800;font-size:13px}
.tabs{display:flex;gap:3px;padding:4px;border-radius:var(--pill);background:var(--card);
  border:1px solid var(--line);position:relative;justify-self:center}
.liq{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:var(--pill);
  background:var(--card2);z-index:0;transition:left .4s var(--spring),width .4s var(--spring)}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:34px;
  padding:0 11px;border:none;background:none;border-radius:var(--pill);
  color:var(--faint);font-size:13px;font-weight:500;cursor:pointer;
  transition:color .2s,padding .38s var(--spring)}
.tab .t{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;
  transition:max-width .38s var(--spring),opacity .2s}
.tab.on{color:var(--txt);padding:0 15px}
.tab.on .t{max-width:90px;opacity:1}
.tab:not(.on):hover{color:var(--dim)}
.user{justify-self:end;display:flex;align-items:center;gap:8px}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--warm-a),var(--warm-b));color:#1a0f08;
  font-size:12.5px;font-weight:700}
.live{width:6px;height:6px;border-radius:50%;background:var(--down);
  box-shadow:0 0 0 0 rgba(62,207,142,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}

/* ================= 网格 ================= */
.view{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  gap:var(--gap);align-items:start}
.view[hidden]{display:none}
.card{min-width:0;background:linear-gradient(180deg,var(--card),#101013);
  border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);
  display:flex;flex-direction:column;
  transition:transform .3s var(--spring),border-color .3s}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.13)}
.card-title{font-size:12.5px;font-weight:500;color:var(--dim);
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.chip{height:26px;padding:0 11px;border-radius:var(--pill);background:var(--card2);
  border:none;color:var(--dim);font-size:11.5px;cursor:pointer}
.chip:hover{color:var(--txt)}

/* ================= Hero ================= */
.hero{grid-column:span 8;grid-row:span 2;
  background:linear-gradient(155deg,var(--warm-a),#ffc08c 45%,var(--warm-b));
  border:none;color:#1a0f08;overflow:hidden;position:relative;
  padding:32px;min-height:300px}
.hero::after{content:"";position:absolute;right:-90px;bottom:-130px;
  width:320px;height:320px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.4),transparent 68%)}
.hero .lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.55}
.hero-num{font-size:clamp(44px,5.6vw,80px);font-weight:700;line-height:.96;
  letter-spacing:-.045em;margin-top:12px;position:relative;z-index:1}
.hero-sub{font-size:13.5px;line-height:1.65;opacity:.75;margin-top:12px;position:relative;z-index:1}
.hero-foot{margin-top:auto;padding-top:22px;display:flex;gap:10px;position:relative;z-index:2}
.btn{height:38px;padding:0 18px;border-radius:var(--pill);border:none;
  font-size:13px;font-weight:600;cursor:pointer;transition:transform .22s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.solid{background:#1a0f08;color:#ffd9bd}
.btn.ghost{background:rgba(255,255,255,.55);color:#1a0f08}
.hero-reason{margin-top:14px;font-size:12.5px;line-height:1.7;
  background:rgba(0,0,0,.12);border-radius:12px;padding:10px 12px;position:relative;z-index:2}

.mini{grid-column:span 4}
.mini-val{font-size:clamp(26px,2.2vw,34px);font-weight:700;letter-spacing:-.03em;
  margin-top:10px;font-variant-numeric:tabular-nums}
.mini-note{font-size:11.5px;color:var(--faint);margin-top:8px}
.badge{display:inline-flex;align-items:center;height:21px;padding:0 9px;
  border-radius:var(--pill);font-size:11px;font-weight:600}
.badge.ok{background:rgba(62,207,142,.13);color:var(--down)}
.badge.bad{background:rgba(242,85,90,.14);color:var(--up)}
.badge.warn{background:rgba(232,179,57,.14);color:var(--warn)}

/* 指标格 */
.idx-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.idx-row.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.idx-item{min-width:0;padding:12px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.03);border:1px solid var(--line)}
.idx-item .n{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx-item .p{font-size:clamp(16px,1.4vw,20px);font-weight:700;margin-top:6px;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.idx-item .c{font-size:11.5px;font-weight:600;margin-top:3px}

/* 列表 */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px;transition:padding-left .2s}
.row:last-child{border-bottom:none;padding-bottom:0}
.row:hover{padding-left:5px}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;color:var(--faint);margin-left:auto;flex:none}
.v{flex:none;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;margin-left:10px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--faint)}
.note{font-size:13px;line-height:1.75;color:var(--dim);white-space:pre-wrap}

.s4{grid-column:span 4}
.s5{grid-column:span 5}
.s3{grid-column:span 3}
.full{grid-column:1/-1}

@media (max-width:900px){
  .wrap{padding:14px 14px 28px}
  .nav{grid-template-columns:1fr auto;gap:8px}
  .tabs{grid-column:1/-1;justify-self:stretch;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .user{display:none}
  .view{grid-template-columns:1fr;gap:12px}
  .hero,.mini,.s4,.s5,.s3,.full{grid-column:1/-1;grid-row:auto}
  .hero{padding:22px;min-height:0}
  .hero-num{font-size:44px}
  .idx-row,.idx-row.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="nav">
    <div class="brand"><span class="mark">O</span>Orion-X</div>
    <nav class="tabs" id="tabs"><span class="liq" id="liq"></span></nav>
    <div class="user"><span class="live"></span><div class="ava">晏</div></div>
  </header>

  <section class="view" id="v-today">
    <div class="card hero">
      <div class="lbl">今日决策</div>
      <div class="hero-num" id="t-verdict">…</div>
      <div class="hero-sub" id="t-sub">数据加载中…</div>
      <div class="hero-foot">
        <button class="btn solid" id="t-why">查看理由</button>
        <button class="btn ghost" id="t-hold">今日不动</button>
      </div>
      <div class="hero-reason" id="t-reason" hidden></div>
    </div>

    <div class="card mini">
      <div class="card-title">仓位上限</div>
      <div class="mini-val" id="t-cap">–</div>
      <div class="mini-note">该情绪阶段下的单笔上限</div>
    </div>

    <div class="card mini">
      <div class="card-title">数据状态<span class="badge ok" id="t-badge">正常</span></div>
      <div class="mini-val" id="t-time">--:--</div>
      <div class="mini-note" id="t-ago">—</div>
    </div>

    <div class="card full">
      <div class="card-title">市场概况</div>
      <div class="idx-row four" id="t-stats"></div>
    </div>

    <div class="card full">
      <div class="card-title">大盘 · 实时<button class="chip" onclick="location.reload()">刷新</button></div>
      <div class="idx-row" id="t-idx"></div>
    </div>

    <div class="card full">
      <div class="card-title">七角色</div>
      <div class="rows" id="t-roles"></div>
    </div>
  </section>

  <section class="view" id="v-market" hidden>
    <div class="card full">
      <div class="card-title">大盘 · 实时</div>
      <div class="idx-row" id="m-idx"></div>
    </div>
    <div class="card full">
      <div class="card-title">涨跌家数</div>
      <div class="rows" id="m-breadth"></div>
    </div>
    <div class="card full">
      <div class="card-title">涨停 / 跌停</div>
      <div class="rows" id="m-limit"></div>
    </div>
  </section>

  <section class="view" id="v-scan" hidden>
    <div class="card full"><div class="card-title">涨停梯队</div><div class="rows" id="s-zt"></div></div>
    <div class="card full"><div class="card-title">题材雷达</div><div class="rows" id="s-theme"></div></div>
    <div class="card full"><div class="card-title">机构研报</div><div class="rows" id="s-report"></div></div>
  </section>

  <section class="view" id="v-hold" hidden>
    <div class="card full"><div class="card-title">七角色 · 权益</div><div class="rows" id="h-roles"></div></div>
    <div class="card full"><div class="card-title">持仓明细</div><div class="rows" id="h-detail"></div></div>
  </section>

  <section class="view" id="v-review" hidden>
    <div class="card full"><div class="card-title">昨日表现</div><div class="rows" id="r-perf"></div></div>
    <div class="card full"><div class="card-title">角色反思</div><div class="rows" id="r-reflect"></div></div>
    <div class="card full"><div class="card-title">收盘小结</div><div class="note" id="r-sum">—</div></div>
  </section>

  <section class="view" id="v-backtest" hidden>
    <div class="card full"><div class="card-title">策略回测 · 各角色</div><div class="rows" id="b-rows"></div></div>
    <div class="card full"><div class="card-title">调参权重</div><div class="rows" id="b-weight"></div></div>
  </section>

  <section class="view" id="v-study" hidden>
    <div class="card s4"><div class="card-title">三条纪律</div><div class="rows">
      <div class="row"><span class="nm">数据不可信，结论一律无效</span></div>
      <div class="row"><span class="nm">单笔 ≤25%，最多持 5 只</span></div>
      <div class="row"><span class="nm">不猜底、不抄底、不追高</span></div>
    </div></div>
    <div class="card s4"><div class="card-title">止损规则</div><div class="rows">
      <div class="row"><span class="nm">常规止损</span><span class="v down">−7%</span></div>
      <div class="row"><span class="nm">3 日内快速止损</span><span class="v down">−5%</span></div>
      <div class="row"><span class="nm">保险丝熔断</span><span class="v down">−12%</span></div>
    </div></div>
    <div class="card s4"><div class="card-title">口径说明</div><div class="rows">
      <div class="row"><span class="nm">收益率</span><span class="tag">总资产口径</span></div>
      <div class="row"><span class="nm">印花税</span><span class="tag">0.05% 单边</span></div>
      <div class="row"><span class="nm">佣金</span><span class="tag">万 1.15，最低 5 元</span></div>
    </div></div>
  </section>

</div>

<script>
const TABS = [
  ['今日','v-today'], ['行情','v-market'], ['扫描','v-scan'], ['持仓','v-hold'],
  ['盘后','v-review'], ['回测','v-backtest'], ['学习','v-study']
];
const $ = id => document.getElementById(id);
const pct = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%';
const cls = v => v > 0.005 ? 'up' : v < -0.005 ? 'down' : 'flat';
const col = v => v > 0.005 ? 'var(--up)' : v < -0.005 ? 'var(--down)' : 'var(--faint)';

/* 建导航 */
const tabsEl = $('tabs');
TABS.forEach(([name, id], i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' on' : '');
  b.innerHTML = '<span class="t">' + name + '</span>' + name.slice(0, 1);
  b.onclick = () => show(id, b);
  tabsEl.appendChild(b);
});
function moveLiq(el) {
  const r = el.getBoundingClientRect(), pr = tabsEl.getBoundingClientRect();
  const liq = $('liq');
  liq.style.left = (r.left - pr.left) + 'px';
  liq.style.width = r.width + 'px';
}
function show(id, btn) {
  TABS.forEach(([, vid]) => { $(vid).hidden = (vid !== id); });
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  if (btn) { btn.classList.add('on'); moveLiq(btn); setTimeout(() => moveLiq(btn), 420); }
}
requestAnimationFrame(() => { const f = tabsEl.querySelector('.tab'); if (f) moveLiq(f); });
window.addEventListener('resize', () => { const on = tabsEl.querySelector('.tab.on'); if (on) moveLiq(on); });

/* ---------- 实时指数 ---------- */
const IDX = { sh000001:'上证指数', sz399001:'深证成指', sz399006:'创业板指',
              sh000688:'科创50', sh000300:'沪深300', sh000905:'中证500' };
function paintIdx(target) {
  const el = $(target); if (!el) return;
  el.innerHTML = Object.keys(IDX).map(k => {
    const raw = window['v_' + k], n = IDX[k];
    if (!raw) return '<div class="idx-item"><div class="n">' + n + '</div><div class="p">—</div><div class="c">—</div></div>';
    const p = String(raw).split('~'), price = p[3], chg = parseFloat(p[32]);
    const c = chg >= 0 ? 'var(--up)' : 'var(--down)';
    return '<div class="idx-item"><div class="n">' + n + '</div>' +
      '<div class="p" style="color:' + c + '">' + price + '</div>' +
      '<div class="c" style="color:' + c + '">' + (chg >= 0 ? '+' : '') + p[32] + '%</div></div>';
  }).join('');
}
function loadIdx() {
  Object.keys(IDX).forEach(k => {
    const old = $('q_' + k); if (old) old.remove();
    const sc = document.createElement('script');
    sc.id = 'q_' + k; sc.src = 'https://qt.gtimg.cn/q=' + k;
    sc.onload = sc.onerror = () => { paintIdx('t-idx'); paintIdx('m-idx'); };
    document.head.appendChild(sc);
  });
  setTimeout(() => { paintIdx('t-idx'); paintIdx('m-idx'); }, 2600);
}
loadIdx();
setInterval(() => { if (document.visibilityState === 'visible') loadIdx(); }, 30000);

/* ---------- data.json ---------- */
let D = null;
function render() {
  if (!D) return;
  const ld = D.limit_decoded || {}, ds = D.dashboard_summary || {}, ms = D.market_sentiment || {};
  const lu = D.last_update ? new Date(String(D.last_update).replace('T', ' ')) : null;
  const mins = lu ? Math.round((Date.now() - lu.getTime()) / 60000) : null;
  const trend = D.market_trend || 'range';
  const vmap = { bull:['可以动手','var(--down)'], bear:['观望为主','var(--warn)'], range:['轻仓参与','var(--down)'] };
  const [vtxt, vcol] = vmap[trend] || ['观望为主','var(--warn)'];
  const zt = ld.zt_count, dt = ld.dt_count, lb = ld.max_lb, mood = ld.mood || '';

  $('t-verdict').textContent = vtxt;
  $('t-verdict').style.color = vcol;
  $('t-sub').innerHTML = (mood ? '情绪' + mood + ' · ' : '') +
    '涨停 ' + (zt ?? '--') + ' 家 / 最高 ' + (lb ?? '--') + ' 板<br>' +
    (trend === 'bear' ? '大盘偏弱 · 只留小仓' : trend === 'bull' ? '大盘偏强 · 主攻突破' : '震荡格局 · 只做低吸');

  const cap = trend === 'bear' ? 0 : trend === 'bull' ? 60 : 25;
  $('t-cap').textContent = cap + '%';
  $('t-cap').style.color = cap === 0 ? 'var(--up)' : 'var(--down)';

  $('t-time').textContent = lu ? String(D.last_update).slice(11, 16) : '--:--';
  $('t-ago').textContent = mins == null ? '—' : (mins > 5 ? '已过 ' + mins + ' 分钟' : '刚刚');
  const bd = $('t-badge');
  bd.textContent = mins != null && mins > 5 ? '过期' : '正常';
  bd.className = 'badge ' + (mins != null && mins > 5 ? 'bad' : 'ok');

  $('t-reason').innerHTML =
    '数据态：' + (mins == null ? '未知' : (mins > 5 ? '过期' : '正常')) +
    '<br>情绪：' + (mood || '—') + ' · 涨停 ' + (zt ?? '--') + ' / 跌停 ' + (dt ?? '--') +
    '<br>regime：' + (trend === 'bear' ? '偏弱' : trend === 'bull' ? '偏强' : '震荡') +
    '<br>结论：' + vtxt + '（仓位上限 ' + cap + '%）';

  /* 市场概况 */
  const up = Math.round((ms.breadth ?? 0) * 100);
  const ret = ds.total_pnl_pct != null ? ds.total_pnl_pct * 100 : null;
  const items = [
    ['涨 / 跌', up + '% / ' + (100 - up) + '%', up >= 50 ? 'var(--up)' : 'var(--down)'],
    ['涨停 / 跌停', (zt ?? '--') + ' / ' + (dt ?? '--'), 'var(--warn)'],
    ['最高连板', (lb ?? '--') + ' 板', 'var(--warn)'],
    ['情绪', mood || '--', 'var(--txt)'],
    ['组合收益', ret == null ? '--' : pct(ret), ret == null ? 'var(--faint)' : col(ret)],
    ['浮动盈亏', ds.total_pnl == null ? '--' : (ds.total_pnl >= 0 ? '+' : '') + Math.round(ds.total_pnl).toLocaleString(), ds.total_pnl == null ? 'var(--faint)' : col(ds.total_pnl)],
    ['总资产', ds.total_assets == null ? '--' : Math.round(ds.total_assets).toLocaleString(), 'var(--txt)'],
    ['活跃 / 交易', (ds.active_roles ?? '--') + ' / ' + (ds.total_trades ?? '--'), 'var(--dim)']
  ];
  $('t-stats').innerHTML = items.map(x =>
    '<div class="idx-item"><div class="n">' + x[0] + '</div>' +
    '<div class="p" style="color:' + x[2] + ';font-size:clamp(15px,1.3vw,18px)">' + x[1] + '</div></div>').join('');

  /* 七角色 */
  const ps = D.players || [];
  $('t-roles').innerHTML = ps.map(p => {
    const r = (p.asset - 100000) / 100000 * 100;
    return '<div class="row"><span class="dot" style="background:' + col(r) + '"></span>' +
      '<span class="nm">' + p.id + ' ' + (p.name || '') + '</span>' +
      '<span class="tag">持仓 ' + (p.holdings || []).length + '</span>' +
      '<span class="v ' + cls(r) + '">' + pct(r) + '</span></div>';
  }).join('');

  /* 行情 */
  $('m-breadth').innerHTML =
    row('上涨占比', up + '%', 'var(--up)') +
    row('恐慌度', Math.round((ms.pessimism ?? 0) * 100) + '%', 'var(--down)') +
    row('传染度', Math.round((ms.contagion ?? 0) * 100) + '%', 'var(--warn)') +
    row('分歧', ms.divergent ? '是' : '否', 'var(--dim)');
  $('m-limit').innerHTML =
    row('涨停', (zt ?? '--') + ' 家', 'var(--up)') +
    row('跌停', (dt ?? '--') + ' 家', 'var(--down)') +
    row('最高连板', (lb ?? '--') + ' 板', 'var(--warn)') +
    row('数据时间', (ld.asof || '—'), 'var(--faint)');

  /* 扫描 */
  const ztr = ld.zt_rows || [];
  $('s-zt').innerHTML = ztr.slice(0, 8).map(r =>
    '<div class="row"><span class="nm">' + (r.name || r.code) + '</span>' +
    '<span class="tag">' + (r.hybk || '') + '</span>' +
    '<span class="v" style="color:var(--up)">' + (r.lbc ? r.lbc + ' 板' : '首板') + '</span></div>'
  ).join('') || empty('今日无涨停数据');

  const themes = (D.theme_radar && D.theme_radar.themes) || [];
  $('s-theme').innerHTML = themes.slice(0, 6).map(t =>
    '<div class="row"><span class="nm">' + (t.name || '—') + '</span>' +
    '<span class="tag">' + (t.n || 0) + ' 只 · 最高 ' + (t.max_lb || 0) + ' 板</span>' +
    '<span class="v" style="color:var(--warn)">' + (t.seal ?? '--') + '</span></div>'
  ).join('') || empty('暂无题材数据');

  const reps = (D.research_feed && D.research_feed.reports) || [];
  $('s-report').innerHTML = reps.slice(0, 8).map(r =>
    '<div class="row"><span class="nm">' + (r.name || '—') + '</span>' +
    '<span class="tag">' + (r.org || '') + (r.date ? ' · ' + r.date.slice(5) : '') + '</span>' +
    '<span class="v" style="color:' + (String(r.rating || '').indexOf('增') >= 0 ? 'var(--up)' : 'var(--dim)') + '">' +
    (r.rating || '—') + '</span></div>'
  ).join('') || empty('暂无研报');

  /* 持仓 */
  $('h-roles').innerHTML = ps.map(p => {
    const r = (p.asset - 100000) / 100000 * 100;
    return '<div class="row"><span class="dot" style="background:' + col(r) + '"></span>' +
      '<span class="nm">' + p.id + ' ' + (p.name || '') + '</span>' +
      '<span class="tag">现金 ' + Math.round(p.cash || 0).toLocaleString() + '</span>' +
      '<span class="v ' + cls(r) + '">' + pct(r) + '</span></div>';
  }).join('');
  const lines = [];
  ps.forEach(p => (p.holdings || []).forEach(h => {
    lines.push('<div class="row"><span class="nm">' + (h.name || h.code) + '</span>' +
      '<span class="tag">' + p.id + ' · ' + (h.qty || 0) + ' 股</span>' +
      '<span class="v" style="color:var(--dim)">' + (h.buyPrice || h.cost || 0).toFixed(2) + '</span></div>');
  }));
  $('h-detail').innerHTML = lines.join('') || empty('当前无持仓');

  /* 盘后 */
  const META = ['ok','rows','promote','bank','reason','asof','date','updated','version','msg'];
  const yp = D.yesterday_perf || {};
  const perfRows = Object.keys(yp).filter(k => META.indexOf(k) < 0).filter(k => {
    const v = yp[k]; return typeof v === 'number' || (v && typeof v === 'object' && (v.ret != null || v.pnl != null));
  }).map(k => {
    const v = yp[k], num = typeof v === 'number' ? v : (v.ret ?? v.pnl) || 0;
    return '<div class="row"><span class="nm">' + k + '</span><span class="v ' + cls(num) + '">' + pct(num) + '</span></div>';
  }).join('');
  $('r-perf').innerHTML = perfRows || row('组合收益', ret == null ? '--' : pct(ret), ret == null ? 'var(--faint)' : col(ret));

  const rf = D.role_reflect || {};
  const rfr = Object.keys(rf).map(k => {
    const t = String(typeof rf[k] === 'string' ? rf[k] : (rf[k] && rf[k].text) || '').trim();
    if (t.length < 3) return '';
    return '<div class="row"><span class="nm">' + k + '</span><span class="tag" style="white-space:normal;text-align:right;max-width:62%">' + t.slice(0, 48) + '</span></div>';
  }).join('');
  $('r-reflect').innerHTML = rfr || empty('暂无反思记录');

  const sum = D.last_summary;
  $('r-sum').textContent = (typeof sum === 'string' && sum) ? sum : (sum && sum.text) || '暂无收盘小结';

  /* 回测 */
  const rs = D.role_stats || {};
  $('b-rows').innerHTML = Object.keys(rs).sort().map(k => {
    const v = rs[k] || {}, p = v.net_pnl;
    return '<div class="row"><span class="nm">' + k + '</span>' +
      '<span class="tag">' + (v.n != null ? v.n + ' 笔' : '') +
      (v.win_rate != null ? ' · 胜率 ' + (v.win_rate * 100).toFixed(0) + '%' : '') + '</span>' +
      '<span class="v" style="color:' + (p == null ? 'var(--faint)' : col(p)) + '">' +
      (p == null ? '--' : (p >= 0 ? '+' : '') + Math.round(p).toLocaleString()) + '</span></div>';
  }).join('') || empty('暂无回测数据');

  const tw = D.tuned_weights || {};
  $('b-weight').innerHTML = Object.keys(tw).slice(0, 8).map(k => {
    const v = tw[k], num = typeof v === 'number' ? v : (v && (v.weight ?? v.w)) || 0;
    return '<div class="row"><span class="nm">' + k + '</span><span class="v" style="color:var(--dim)">' + Number(num).toFixed(2) + '</span></div>';
  }).join('') || empty('暂无调参记录');
}
function row(label, value, color) {
  return '<div class="row"><span class="nm">' + label + '</span>' +
    '<span class="v" style="color:' + color + '">' + value + '</span></div>';
}
function empty(t) { return '<div class="row"><span class="nm" style="color:var(--faint)">' + t + '</span></div>'; }

/* 交互 */
$('t-why').onclick = () => { const r = $('t-reason'); r.hidden = !r.hidden; };
$('t-hold').onclick = () => { $('t-hold').textContent = '已标记今日不动'; $('t-hold').disabled = true; };

fetch('data.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { D = d; render(); })
  .catch(e => {
    $('t-verdict').textContent = '读不到数据';
    $('t-sub').innerHTML = 'data.json 加载失败：' + e.message;
  });
</script>
</body>
</html>
