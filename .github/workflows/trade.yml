name: AI交易引擎定时任务

# 每天交易时间自动运行 + 每周日自动回测调参
on:
  schedule:
    # 北京时间 9:35, 10:00, 10:30, 11:00, 11:30, 13:30, 14:00, 14:30, 15:00, 15:05(收盘总结), 15:30(兜底)
    # 收盘总结窗口已放宽到 15:00-15:55，且有 data.json 跨运行去重标记，
    # 多个 cron 落在窗口内不会重复推送；15:30 兜底防 15:05 排队延迟错过
    - cron: '35 1 * * *'   # 9:35 北京时间
    - cron: '0 2 * * *'    # 10:00
    - cron: '30 2 * * *'   # 10:30
    - cron: '0 3 * * *'    # 11:00
    - cron: '30 3 * * *'   # 11:30
    - cron: '30 5 * * *'   # 13:30
    - cron: '0 6 * * *'    # 14:00
    - cron: '30 6 * * *'   # 14:30
    - cron: '0 7 * * *'    # 15:00
    - cron: '5 7 * * *'    # 15:05 收盘总结推送
    - cron: '30 7 * * *'   # 15:30 收盘总结兜底（窗口内已推过则自动跳过）
    - cron: '0 10 * * 0'   # 每周日 18:00 北京时间：回测参数评估（backtest job）
  workflow_dispatch:  # 允许手动触发
    inputs:
      force_summary:
        description: '强制发送每日收盘总结（忽略时间窗口，用于补发/验证）'
        type: boolean
        default: false

permissions:
  contents: write   # 内置 GITHUB_TOKEN 默认只读，不授权则上传 data.json 报
                    # "Resource not accessible by integration"，数据永远回写不了仓库

jobs:
  trade:
    runs-on: ubuntu-latest
    # 周日回测 cron 时不跑交易（避免无谓运行）；其余 schedule / 手动均跑
    if: github.event_name != 'schedule' || github.event.schedule != '0 10 * * 0'
    env:
      # 双保险：runner 默认 TZ=UTC，这里显式设为北京时间，
      # 配合 trade_engine.py 的 cn_now()（不依赖环境变量，恒定 UTC+8）
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行交易引擎
        env:
          # 在仓库 Settings → Secrets and variables → Actions 配置：
          #   WXPUSHER_APP_TOKEN (AT_xxx)、WXPUSHER_UID (UID_xxx)
          # 推送通道唯一：WxPusher（Server酱 已移除，WECHAT_PUSH_KEY 不再注入）
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WXPUSHER_TOPIC_ID: ${{ secrets.WXPUSHER_TOPIC_ID }}
          FORCE_SUMMARY: ${{ github.event.inputs.force_summary || '0' }}
        run: python trade_engine.py

      - name: 用GitHub API更新data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用Python直发GitHub API上传data.json（curl内嵌base64在文件变大后会超命令行长度上限）
          python3 - <<'PYEOF'
          import json,base64,urllib.request,os
          tok=os.environ["GH_TOKEN"]
          base="https://api.github.com/repos/orion-x05/trade-panel"
          def gh(method,url,payload=None):
              req=urllib.request.Request(base+url, method=method,
                  headers={"Authorization":"token "+tok,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
              data=json.dumps(payload).encode() if payload is not None else None
              with urllib.request.urlopen(req,data=data) as r:
                  return json.loads(r.read().decode())
          meta=gh("GET","/contents/data.json?ref=main")
          content=base64.b64encode(open("data.json","rb").read()).decode()
          gh("PUT","/contents/data.json",{"message":"auto: 交易引擎更新","content":content,"sha":meta.get("sha"),"branch":"main"})
          print("✅ data.json 已更新")
          PYEOF

  backtest:
    runs-on: ubuntu-latest
    # 仅周日回测 cron 或手动触发时跑；交易时段 cron 不跑
    if: github.event_name != 'schedule' || github.event.schedule == '0 10 * * 0'
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行回测生成 bt_tune.json
        run: python backtest.py

      - name: 提交 bt_tune.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f bt_tune.json ]; then echo "无 bt_tune.json，跳过提交"; exit 0; fi
          python3 - <<'PYEOF'
          import json,base64,urllib.request,os
          tok=os.environ["GH_TOKEN"]
          base="https://api.github.com/repos/orion-x05/trade-panel"
          def gh(method,url,payload=None):
              req=urllib.request.Request(base+url, method=method,
                  headers={"Authorization":"token "+tok,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
              data=json.dumps(payload).encode() if payload is not None else None
              with urllib.request.urlopen(req,data=data) as r:
                  return json.loads(r.read().decode())
          try:
              meta=gh("GET","/contents/bt_tune.json?ref=main")
          except Exception:
              print("bt_tune.json 在 main 不存在，跳过提交"); raise SystemExit(0)
          content=base64.b64encode(open("bt_tune.json","rb").read()).decode()
          gh("PUT","/contents/bt_tune.json",{"message":"auto: 回测参数更新","content":content,"sha":meta.get("sha"),"branch":"main"})
          print("✅ bt_tune.json 已更新")
          PYEOF
